upstream django_v1 {
    server web_django:8000;
}

upstream flask_pronosticos {
    server pronosticos_flask:5000;
}

upstream flask_pagos {
    server pagos_flask:5001;
}

upstream flask_catalogo {
    server catalogo_flask:5002;
}

upstream flask_estadisticas {
    server estadisticas_flask:5003;
}

server {
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/static/;
    }

    location /api/v2/pronosticos {
        proxy_pass http://flask_pronosticos;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/pagos {
        proxy_pass http://flask_pagos;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/catalogo {
        proxy_pass http://flask_catalogo;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/estadisticas {
        proxy_pass http://flask_estadisticas;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monolito legado: HTML, admin y /api/v1/.
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
