upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pronosticos_flask:5000;
}

server {
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/static/;
    }

    # Ruta estrangulada: el motor de pronosticos ya vive en Flask.
    location /api/v2/pronosticos {
        proxy_pass http://flask_v2;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monolito legado: /api/v1/, vistas HTML y admin siguen en Django.
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
