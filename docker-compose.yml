services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=pronostix_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pronostix_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Monolito (v1): catalogo, compra de pases, acceso y vistas HTML.
  web_django:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_pronostix &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pronostix_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=*
      - ENV_TYPE=REAL
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  # Microservicio (v2): motor de pronosticos estrangulado del monolito.
  pronosticos_flask:
    build: ./microservicio_pronosticos

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
    depends_on:
      - web_django
      - pronosticos_flask

volumes:
  postgres_data:
  static_data:
