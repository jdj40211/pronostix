services:
  db:
    restart: unless-stopped
    image: postgres:15
    environment:
      - POSTGRES_DB=pronostix_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pronostix_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Orquestador HTML + API v1 (compra). Delega cobro/catalogo/stats a Flask.
  web_django:
    restart: unless-stopped
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py compilemessages --ignore=venv &&
             python manage.py seed_pronostix &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pronostix_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=*
      - ENV_TYPE=REAL
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STATS_PROVIDER=${STATS_PROVIDER:-MOCK}
      - ALIADO_API_URL=${ALIADO_API_URL:-}
      - PAGOS_URL=http://pagos_flask:5001
      - CATALOGO_URL=http://catalogo_flask:5002
      - ESTADISTICAS_URL=http://estadisticas_flask:5003
      - PRONOSTICOS_URL=http://pronosticos_flask:5000
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pagos_flask:
        condition: service_started
      catalogo_flask:
        condition: service_started
      estadisticas_flask:
        condition: service_started

  worker:
    restart: unless-stopped
    build: .
    command: celery -A config worker -l info
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pronostix_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=*
      - ENV_TYPE=REAL
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PAGOS_URL=http://pagos_flask:5001
      - CATALOGO_URL=http://catalogo_flask:5002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pronosticos_flask:
    restart: unless-stopped
    build: ./microservicio_pronosticos

  pagos_flask:
    restart: unless-stopped
    build: ./microservicio_pagos

  catalogo_flask:
    restart: unless-stopped
    build: ./microservicio_catalogo

  estadisticas_flask:
    restart: unless-stopped
    build: ./microservicio_estadisticas
    environment:
      - STATS_PROVIDER=${STATS_PROVIDER:-MOCK}

  nginx:
    restart: unless-stopped
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
    depends_on:
      - web_django
      - pronosticos_flask
      - pagos_flask
      - catalogo_flask
      - estadisticas_flask

volumes:
  postgres_data:
  static_data:
