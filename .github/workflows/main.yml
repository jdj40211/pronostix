name: CI/CD Pronostix

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASS }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build & Push All Components
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/pronostix-monolito:latest .
          docker build -t ${{ secrets.DOCKERHUB_USER }}/pronostix-pronosticos:latest ./microservicio_pronosticos
          docker build -t ${{ secrets.DOCKERHUB_USER }}/pronostix-nginx:latest ./nginx

          docker push ${{ secrets.DOCKERHUB_USER }}/pronostix-monolito:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/pronostix-pronosticos:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/pronostix-nginx:latest
